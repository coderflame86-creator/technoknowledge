<!doctype html>
<!-- =========================================================
     Technoknowledge: PAGE TEMPLATE for frontend/pages/
     Copy this file to start a new page, then:
       1. set <title>, meta description, canonical and og tags
       2. write the page inside <main id="main">
       3. run: node scripts/sync-components.mjs
     ========================================================= -->
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title | Technoknowledge</title>
  <meta name="description" content="One sentence (150–160 characters) that tells Google and visitors what this page offers.">
  <link rel="canonical" href="https://thetechnoknowledge.com/page-name">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Technoknowledge">
  <meta property="og:title" content="Page title | Technoknowledge">
  <meta property="og:description" content="Same as the meta description.">
  <meta property="og:image" content="https://thetechnoknowledge.com/assets/images/share/tk-default.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://thetechnoknowledge.com/assets/images/share/tk-default.jpg">

  <link rel="icon" href="../assets/images/logos/tk-icon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/images/logos/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../assets/images/logos/apple-touch-icon.png">
  <meta name="theme-color" content="#13294B">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Sora:wght@600;700;800&display=swap">

  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <!-- <link rel="stylesheet" href="../css/pages/page-name.css"> -->

  <script>document.documentElement.className = 'js';</script>
  <script src="../js/components/header.js" defer></script>
  <script src="../js/components/reveal.js" defer></script>
  <script src="../js/main.js" defer></script>
</head>
<body>

</main>

</html>
